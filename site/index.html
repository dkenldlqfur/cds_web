<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>대항해시대 3 ver 히소카</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#101820;color:#f3f5ed;font:15px system-ui,sans-serif}
body{overflow:hidden}
/* Fit the complete game surface to the visible viewport, including browser chrome. */
#app{position:absolute;left:var(--visual-left,0px);top:var(--visual-top,0px);width:var(--visual-width,100%);height:var(--visual-height,100dvh);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#screen{position:relative;flex:1;min-width:0;min-height:0;width:100%;overflow:hidden}
#canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:var(--display-width,640px)!important;height:var(--display-height,480px)!important;display:block;max-width:none;max-height:none;outline:none;touch-action:none;image-rendering:pixelated}
button{font:inherit;color:inherit;background:#263b49;border:1px solid #5a7483;border-radius:7px;min-width:44px;min-height:44px;padding:8px 12px;touch-action:manipulation}
button:active,button[aria-pressed=true]{background:#a77a30;color:#fff}
button:disabled{opacity:.5}
/* Match the canvas bounds. Only buttons intercept touches; all gaps reach the game. */
#tools{position:absolute;z-index:2;left:50%;top:50%;transform:translate(-50%,-50%);width:var(--display-width,640px);height:var(--display-height,480px);pointer-events:none}
#tools .direction-controls{position:absolute;left:8px;bottom:8px;transform:scale(var(--controls-scale,1));transform-origin:bottom left}
.direction-pad{display:grid;grid-template-columns:repeat(3,44px);gap:3px}
#action-keys{position:absolute;right:8px;bottom:8px;transform:scale(var(--controls-scale,1));transform-origin:bottom right;display:grid;grid-template-columns:repeat(3,52px);gap:3px}
#tools button{pointer-events:auto;touch-action:none;min-width:0;min-height:44px;padding:3px;font-size:13px;line-height:1.15;background:rgba(20,34,45,.58);border-color:rgba(170,197,213,.65);text-shadow:0 1px 2px #000;user-select:none;-webkit-user-select:none}
#tools button:active,#tools button[aria-pressed=true]{background:rgba(167,122,48,.9)}
#control-hint{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
#cover{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#101820;z-index:10;padding:24px}
#card{width:min(440px,100%);text-align:center;line-height:1.6}
h1{font-size:25px;font-weight:600;margin:0 0 14px}
progress{width:100%;height:12px;accent-color:#d9af63}
#status{min-height:48px;white-space:pre-wrap;overflow-wrap:anywhere}
#start{background:#a77a30;min-width:140px}
#tip{font-size:13px;color:#acbec8}
#error{color:#f2b0a8}
body:not(.started) #tools{visibility:hidden}
@media(max-height:420px){#tip{display:none}}
</style>
<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

</head>
<body>
<main id="app">
 <p id="download" role="status" hidden></p>
 <div id="screen"><canvas id="canvas" width="640" height="480" tabindex="0" aria-label="게임 화면"></canvas>
 <nav id="tools" aria-label="게임 조작">
  <div class="direction-controls">
   <div class="direction-pad" role="group" aria-label="숫자·방향 키패드">
    <button type="button" data-key="7" aria-label="7, 왼쪽 위">↖ 7</button><button type="button" data-key="8" aria-label="8, 위">↑ 8</button><button type="button" data-key="9" aria-label="9, 오른쪽 위">↗ 9</button>
    <button type="button" data-key="4" aria-label="4, 왼쪽">← 4</button><button type="button" data-key="5" aria-label="5, 항해 정지 또는 재개">5</button><button type="button" data-key="6" aria-label="6, 오른쪽">→ 6</button>
    <button type="button" data-key="1" aria-label="1, 왼쪽 아래">↙ 1</button><button type="button" data-key="2" aria-label="2, 아래">↓ 2</button><button type="button" data-key="3" aria-label="3, 오른쪽 아래">↘ 3</button>
   </div>
  </div>
  <div id="action-keys">
   <button type="button" data-key="Enter">Enter</button><button type="button" data-key="Escape">Esc</button><button type="button" data-key="Tab">Tab</button>
   <button type="button" data-key=" ">Space</button><button type="button" data-key="0">0</button><button type="button" data-key="Backspace">⌫</button>
   <button id="right" type="button" aria-pressed="false" aria-label="우클릭 1회">우클릭</button><button id="fullscreen" type="button">전체 화면</button>
  </div>
  <p id="control-hint" aria-live="polite">키패드: 메뉴 이동 · 항해 방향 지정 · 5는 항해 정지/재개</p>
 </nav>
 </div>
</main>
<div id="cover"><div id="card"><h1>대항해시대 3 ver 히소카</h1><p id="status" role="status">게임 데이터를 준비합니다.</p><progress id="progress" max="1" value="0"></progress><p><button id="start" disabled>준비 중…</button></p><p id="tip">가로 화면을 권장합니다. 화면을 눌러 선택하고,<br>우클릭은 버튼을 누른 뒤 게임 화면을 터치하세요.<br>저장은 이 브라우저에 보관됩니다.</p><p id="error" role="alert"></p></div></div>
<script src="index.js"></script>
<script>
'use strict';
const config={"args":[],"canvasResizePolicy":1,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":true,"fileSizes":{"index.pck":31542468,"index.wasm":1713410},"focusCanvas":true,"gdextensionLibs":["cds_native.web.wasm"],"godotPoolSize":4};
const canvas=document.getElementById('canvas'),screen=document.getElementById('screen'),start=document.getElementById('start'),status=document.getElementById('status'),progress=document.getElementById('progress');
config.canvas=canvas;config.canvasResizePolicy=1;config.focusCanvas=true;
config.onProgress=(current,total)=>{if(total){progress.value=current/total;}};
config.onExit=()=>{document.getElementById('cover').hidden=false;document.getElementById('cover').style.display='flex';status.textContent='게임이 종료되었습니다. 다시 실행하려면 페이지를 새로고침하세요.';start.hidden=true;};
const engine=new Engine(config);
function fit(){
 const viewport=window.visualViewport,root=document.documentElement;
 root.style.setProperty('--visual-width',`${viewport?.width||root.clientWidth}px`);
 root.style.setProperty('--visual-height',`${viewport?.height||window.innerHeight}px`);
 root.style.setProperty('--visual-left',`${viewport?.offsetLeft||0}px`);
 root.style.setProperty('--visual-top',`${viewport?.offsetTop||0}px`);
 const width=canvas.width||640,height=canvas.height||480;
 const scale=Math.max(0,Math.min(screen.clientWidth/width,screen.clientHeight/height));
 const displayWidth=Math.floor(width*scale),displayHeight=Math.floor(height*scale);

 screen.style.setProperty('--display-height',`${displayHeight}px`);
 screen.style.setProperty('--controls-scale',String(Math.max(0,Math.min(1,(displayWidth-24)/300,(displayHeight-16)/138))));
}
let fitFrame=0;
function scheduleFit(){if(!fitFrame)fitFrame=requestAnimationFrame(()=>{fitFrame=0;fit();});}
function requestGameExtent(){
 const orientation=window.screen?.orientation?.type;
 const landscape=orientation?orientation.startsWith('landscape'):typeof window.orientation==='number'?Math.abs(window.orientation)===90:screen.clientWidth>screen.clientHeight;
 const frameHeight=Math.max(480,Math.min(544,canvas.height||480));
 const width=landscape?Math.max(640,Math.min(1536,Math.ceil(frameHeight*screen.clientWidth/Math.max(1,screen.clientHeight)/16)*16)):640;
 // One latest request, consumed by the native engine and applied at a safe
 // World wait boundary. Height stays 480; extra width exposes more map tiles.
 window.CDS95RequestedExtent=(480<<16)|width;
}
function fitGameViewport(){fit();requestGameExtent();}
let fitTimers=[];
function settleFit(){
 // Safari can report the old visual viewport during the rotation event.
 // Read it again as browser chrome/safe areas settle, without restarting Godot.
 for(const timer of fitTimers)clearTimeout(timer);

}
new ResizeObserver(scheduleFit).observe(screen);

window.addEventListener('resize',scheduleFit);window.addEventListener('orientationchange',settleFit);

window.addEventListener('pageshow',settleFit);

window.visualViewport?.addEventListener('resize',scheduleFit);window.visualViewport?.addEventListener('scroll',scheduleFit);
document.addEventListener('fullscreenchange',settleFit);fit();
function fail(error){status.textContent='게임을 시작할 수 없습니다.';document.getElementById('error').textContent=String(error.message||error);start.disabled=true;start.textContent='시작 불가';console.error(error);}

 status.textContent='처음 접속한 브라우저를 준비합니다. 잠시 후 자동으로 다시 열립니다.';
 await navigator.serviceWorker.register(url.href,{scope:'./',updateViaCache:'none'});

  const ready=()=>navigator.serviceWorker.controller?.scriptURL===url.href;
  if(ready()){resolve();return;}

  function changed(){if(ready()){clearTimeout(timeout);navigator.serviceWorker.removeEventListener('controllerchange',changed);resolve();}}

  changed();
 });

async function assets(){
 if(!await prepareBrowser())return;

 const manifest=await response.json();globalThis.CDS95Assets={};for(const file of manifest.files){for(const path of [file.path,...(file.aliases||[])])globalThis.CDS95Assets[path]=file;}

 const initial=manifest.files.filter(file=>!file.deferred);let index=0,loaded=0;const total=initial.reduce((n,file)=>n+file.size,0);
 async function worker(){while(index<initial.length){const file=initial[index++];const response=await fetch(file.url);if(!response.ok)throw new Error(`데이터 다운로드 실패: ${file.url}`);const data=await response.arrayBuffer();if(data.byteLength!==file.size)throw new Error(`데이터 크기 불일치: ${file.url}`);
  const hash=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',data)),n=>n.toString(16).padStart(2,'0')).join('');if(hash!==file.sha256)throw new Error(`데이터 검증 실패: ${file.url}`);
  await engine.preloadFile(data,file.path);for(const alias of file.aliases||[])await engine.preloadFile(data,alias);loaded+=file.size;progress.value=loaded/total;status.textContent=`게임 데이터 준비 ${Math.round(loaded/total*100)}%`;
 }}
 await Promise.all([worker(),worker(),worker()]);status.textContent='준비가 끝났습니다. 시작을 눌러주세요.';start.disabled=false;start.textContent='시작';
}
start.addEventListener('click',async()=>{start.disabled=true;start.textContent='실행 중…';try{await engine.startGame();document.getElementById('cover').style.display='none';document.body.classList.add('started');canvas.focus();fit();}catch(error){fail(error);}});
// Physical key names retain their original per-screen meanings. Both native
// gameplay and Godot dialogs pull their own queue on the engine frame.
const codes={ArrowLeft:[37,'ArrowLeft'],ArrowUp:[38,'ArrowUp'],ArrowRight:[39,'ArrowRight'],ArrowDown:[40,'ArrowDown'],Enter:[13,'Enter'],Escape:[27,'Escape'],Tab:[9,'Tab'],Backspace:[8,'Backspace'],' ':[32,'Space'],'0':[48,'Digit0'],'1':[49,'Digit1'],'2':[50,'Digit2'],'3':[51,'Digit3'],'4':[52,'Digit4'],'5':[53,'Digit5'],'6':[54,'Digit6'],'7':[55,'Digit7'],'8':[56,'Digit8'],'9':[57,'Digit9']};
const pendingKeys=[];
window.CDS95TakeKeys=()=>JSON.stringify(pendingKeys.splice(0));
// Legacy input is pulled by the actual native Device pump. Keep the engine
// event copy for Godot dialogs, separate from this single-consumer queue.
const nativeCodes={ArrowLeft:0x4b00,ArrowUp:0x4800,ArrowRight:0x4d00,ArrowDown:0x5000,Enter:13,Escape:27,Tab:9,Backspace:8,' ':32,'0':48,'1':49,'2':50,'3':51,'4':52,'5':53,'6':54,'7':55,'8':56,'9':57};
const nativeKeys=[];
window.CDS95PopKey=()=>nativeKeys.shift()||0;
function key(key,down,repeat=false){
 if(!Object.prototype.hasOwnProperty.call(codes,key))return;
 if(down)nativeKeys.push(nativeCodes[key]);
 pendingKeys.push([key,down,repeat]);
}
const keyReleases=[];
function releaseKeys(){for(const release of keyReleases)release();}
for(const button of document.querySelectorAll('[data-key]')){
 let heldKey='',pointer=null,delay,timer,pointerClick=false;
 const release=()=>{if(!heldKey)return;const released=heldKey;heldKey='';pointer=null;clearTimeout(delay);clearInterval(timer);key(released,false);};
 keyReleases.push(release);
 button.addEventListener('pointerdown',event=>{
  if(button.disabled||heldKey||event.button!==0)return;
  event.preventDefault();heldKey=button.dataset.key;pointer=event.pointerId;pointerClick=true;
  button.setPointerCapture(pointer);key(heldKey,true);
  if('2468'.includes(heldKey))delay=setTimeout(()=>{if(heldKey){key(heldKey,true,true);timer=setInterval(()=>{if(heldKey)key(heldKey,true,true);},160);}},300);
 });
 for(const event of ['pointerup','pointercancel','lostpointercapture'])button.addEventListener(event,e=>{if(e.pointerId===pointer){release();if(event!=='pointerup')pointerClick=false;}});
 // Keyboard/assistive activation has no pointerdown. A pointer click already
 // sent its key and must not send a duplicate after pointerup.
 button.addEventListener('click',event=>{if(pointerClick){pointerClick=false;return;}if(event.detail===0&&!button.disabled){key(button.dataset.key,true);key(button.dataset.key,false);}});
}
window.addEventListener('blur',releaseKeys);document.addEventListener('visibilitychange',()=>{if(document.hidden)releaseKeys();});
let rightMode=false,rightTouch=null;const right=document.getElementById('right');right.addEventListener('click',()=>{rightMode=!rightMode;right.setAttribute('aria-pressed',String(rightMode));canvas.focus();});
function mouse(type,touch,pressed){canvas.dispatchEvent(new MouseEvent(type,{clientX:touch.clientX,clientY:touch.clientY,button:2,buttons:pressed?2:0,bubbles:true,cancelable:true}));}
canvas.addEventListener('contextmenu',event=>event.preventDefault());
canvas.addEventListener('touchstart',event=>{if(!rightMode||rightTouch!==null)return;event.preventDefault();event.stopImmediatePropagation();const touch=event.changedTouches[0];rightTouch=touch.identifier;mouse('mousemove',touch,false);mouse('mousedown',touch,true);},{capture:true,passive:false});
canvas.addEventListener('touchmove',event=>{if(rightTouch===null)return;const touch=Array.from(event.changedTouches).find(t=>t.identifier===rightTouch);if(touch){event.preventDefault();event.stopImmediatePropagation();mouse('mousemove',touch,true);}},{capture:true,passive:false});
function releaseRight(event){if(rightTouch===null)return;const touch=Array.from(event.changedTouches).find(t=>t.identifier===rightTouch);if(!touch)return;event.preventDefault();event.stopImmediatePropagation();mouse('mouseup',touch,false);rightTouch=null;rightMode=false;right.setAttribute('aria-pressed','false');}

document.getElementById('fullscreen').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.getElementById('app').requestFullscreen)await document.getElementById('app').requestFullscreen();}catch(error){console.info(error);}});
document.getElementById('fullscreen').hidden=!document.fullscreenEnabled;
assets().catch(fail);
</script>
