canvas.addEventListener('touchstart',event=>{if(!rightMode||rightTouch!==null)return;event.preventDefault();event.stopImmediatePropagation();const touch=event.changedTouches[0];rightTouch=touch.identifier;lastRightTouch=touch;mouse('mousemove',touch,false);mouse('mousedown',touch,true);},{capture:true,passive:false});
canvas.addEventListener('touchmove',event=>{if(rightTouch===null)return;const touch=Array.from(event.changedTouches).find(t=>t.identifier===rightTouch);if(touch){event.preventDefault();event.stopImmediatePropagation();lastRightTouch=touch;mouse('mousemove',touch,true);}},{capture:true,passive:false});
function releaseRight(event){if(rightTouch===null)return;const touch=Array.from(event.changedTouches).find(t=>t.identifier===rightTouch);if(!touch)return;event.preventDefault();event.stopImmediatePropagation();mouse('mouseup',touch,false);rightTouch=null;lastRightTouch=null;rightMode=false;right.setAttribute('aria-pressed','false');}
canvas.addEventListener('touchend',releaseRight,{capture:true,passive:false});canvas.addEventListener('touchcancel',releaseRight,{capture:true,passive:false});
document.getElementById('fullscreen').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.getElementById('app').requestFullscreen)await document.getElementById('app').requestFullscreen();}catch(error){console.info(error);}});
document.getElementById('fullscreen').hidden=!canFullscreen;
window.CDS95SetKeypadHidden=hidden=>{
 const tools=document.getElementById('tools');hidden=Boolean(hidden);
 if(hidden){
  releaseKeys();nativeKeys.length=0;
  // Retain key-up events so the GUI cannot keep a previously held direction.
  const releases=pendingKeys.filter(event=>!event[1]);pendingKeys.splice(0,pendingKeys.length,...releases);
  if(rightTouch!==null&&lastRightTouch)mouse('mouseup',lastRightTouch,false);
  rightTouch=null;lastRightTouch=null;rightMode=false;right.setAttribute('aria-pressed','false');
  if(tools.contains(document.activeElement))canvas.focus();
 }
 tools.hidden=hidden;
};
assets().catch(fail);
